name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        # Python version comes from .python-version; no separate setup-python needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      - name: Behave
        run: uv run behave
      - name: Export OpenAPI
        run: uv run python tools/export_openapi.py
      - name: OpenAPI drift check
        run: git diff --exit-code docs/openapi/openapi.yaml
      - name: Export index schema
        run: uv run python tools/export_index_schema.py
      - name: Index schema drift check
        run: git diff --exit-code docs/search/index-schema.json
      - name: Export audit event schema
        run: uv run python tools/export_audit_schema.py
      - name: Audit schema drift check
        run: git diff --exit-code docs/audit/
      - name: Mermaid diagram syntax gate
        run: scripts/check_diagrams.sh

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (gate only; Day 24 adds a manual push to ACR, Day 25 automates push and deploy here)
        run: docker build -f docker/Dockerfile -t azgenai-lab:ci .
      - name: Docker boot smoke
        # A build that succeeds is not proof the image runs -- this milestone's worst bug
        # was exactly that (a module-relative default path that only breaks once the
        # project is installed non-editable, which every image build does). Runs with
        # zero configuration, the same way the Quick start in docs/docker.md does.
        #
        # Two different assertions, both needed (Day 23 review r03 R3): polling
        # `docker inspect` proves the Dockerfile's own declared HEALTHCHECK --
        # its command, URL, user and flags -- actually reports healthy; a
        # separate `docker exec` probe with no involvement from HEALTHCHECK at
        # all would pass even if that instruction were broken (confirmed by
        # deliberately pointing HEALTHCHECK at the wrong port: the exec probe
        # below still succeeds while the inspect poll goes unhealthy -- Day 23
        # review r03 R3, second wave). The exact-body `docker exec` check
        # afterwards proves what /health actually returns, against the
        # container's own loopback instead of a published port, so this
        # never needs a port on the runner.
        run: |
          set -euo pipefail
          NAME="azgenai-lab-ci-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$NAME" azgenai-lab:ci

          # The image's HEALTHCHECK has --start-period=5s and an unset (so
          # default 5s) --start-interval, meaning the first probe fires
          # around 5s in and resolves to healthy within the first couple of
          # attempts on the happy path. A genuinely broken HEALTHCHECK is a
          # slower story: start-period failures don't count toward
          # --retries=3, so it takes one start-period probe plus three
          # --interval=30s retries -- on the order of 95-100s -- before
          # Docker reports unhealthy. 60 attempts at 2s (120s) covers that
          # with some room, not a generous margin.
          status=unknown
          for attempt in $(seq 1 60); do
            if ! status="$(docker inspect --format '{{.State.Health.Status}}' "$NAME" 2>&1)"; then
              echo "docker inspect failed on attempt $attempt: $status" >&2
              status="inspect-error"
              break
            fi
            if [ "$status" = healthy ] || [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "container HEALTHCHECK never reported healthy (status: $status); docker inspect health output and container log follow" >&2
            docker inspect --format '{{json .State.Health}}' "$NAME" >&2 || true
            docker logs "$NAME" >&2
            exit 1
          fi
          echo "HEALTHCHECK status: $status"

          body="$(docker exec "$NAME" python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read().decode())")"
          echo "health body: $body"
          test "$body" = '{"status":"ok","service":"azure-genai-backend-lab"}'
