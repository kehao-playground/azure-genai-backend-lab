name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    # Read the repo and nothing else -- in particular no id-token, so this
    # job can never mint an OIDC token and never gets Azure access.
    # Declaring `permissions` at all zeroes every scope not listed;
    # `contents: read` is what actions/checkout below needs, restated here
    # rather than left to a default this repo does not rely on elsewhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        # Python version comes from .python-version; no separate setup-python needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Mypy (tools)
        # `mypy` with no argument checks only the configured packages
        # (pyproject: packages = ["azgenai_lab"]), so every script under
        # tools/ -- twelve of them now, including the Day 28 eval runner whose
        # own gate depends on being type-checked -- went uncovered until
        # this step existed. A directory, never a hand-maintained list of
        # filenames: a list silently stops covering the next file someone
        # adds, which is the stale-enumeration failure this repo has been
        # bitten by before.
        run: uv run mypy tools/
      - name: Pytest
        run: uv run pytest
      - name: Behave
        run: uv run behave
      - name: Export OpenAPI
        run: uv run python tools/export_openapi.py
      - name: OpenAPI drift check
        run: git diff --exit-code docs/openapi/openapi.yaml
      - name: Export index schema
        run: uv run python tools/export_index_schema.py
      - name: Index schema drift check
        run: git diff --exit-code docs/search/index-schema.json
      - name: Export audit event schema
        run: uv run python tools/export_audit_schema.py
      - name: Audit schema drift check
        run: git diff --exit-code docs/audit/
      - name: Mermaid diagram syntax gate
        run: scripts/check_diagrams.sh
      - name: Doc anchor gate
        # A heading rename in one file silently breaks `#…` links in others.
        # That shipped twice in the Day 25 review topic before this gate
        # existed: the manual sweep's scope was the file being retitled, and
        # a cross-file reference is exactly what such a sweep cannot see.
        #
        # Structure comes from markdown-it-py and slugs from a table generated
        # by running github-slugger itself (scripts/vendor_github_slugger.py).
        # Both halves were hand-rolled once and both were wrong; the emoji case
        # made an ordinary heading fail open. No network here -- the table and
        # its differential corpus are committed. The table's own integrity is
        # guarded offline by a pinned sha256 in tests/unit/test_check_doc_anchors.py;
        # proving it still matches UPSTREAM needs
        # `scripts/vendor_github_slugger.py --check`, which needs the network
        # and is deliberately not run here.
        run: uv run python scripts/check_doc_anchors.py
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        # Pinned by version and verified by checksum -- no new package manager,
        # per D12: this is a tarball off GitHub Releases, the same way
        # scripts/check_diagrams.sh pins mermaid-cli.
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: actionlint
        # actionlint cannot catch the class of bug Day 24 shipped -- bugs
        # that are only visible once the workflow actually runs against
        # real Azure and GitHub state. What it does catch: a typo'd
        # `needs.image.outputs.digest` reference, which GitHub Actions
        # itself would otherwise evaluate to a silently empty string that
        # flows straight into `--image` below.
        run: ./actionlint -color

  site:
    runs-on: ubuntu-latest
    # Read the repo and nothing else -- same reasoning as the python job
    # above: no id-token, so this job can never mint an OIDC token.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build

  image:
    runs-on: ubuntu-latest
    # id-token: write is what lets azure/login mint an OIDC token below;
    # contents: read has to be restated here even though it sounds like it
    # should be implied -- declaring `permissions` at all zeroes every scope
    # not listed, and actions/checkout needs it.
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Gate for every push and PR. On main, once DEPLOY_ENABLED is armed,
      # this is also the image the steps below push to ACR and deploy --
      # the bytes that pass boot smoke are the exact bytes that get deployed
      # (pushed by digest below, never by a tag that could be reused).
      - name: Docker build
        run: docker build -f docker/Dockerfile -t azgenai-lab:ci .

      - name: Docker boot smoke
        # A build that succeeds is not proof the image runs -- this milestone's worst bug
        # was exactly that (a module-relative default path that only breaks once the
        # project is installed non-editable, which every image build does). Runs with
        # zero configuration, the same way the Quick start in docs/docker.md does.
        #
        # Logic lives in scripts/boot_smoke.sh (Day 25 extraction), including the two
        # assertions Day 23 review r03 R3 established neither substitutes for the other:
        # polling `docker inspect` proves the Dockerfile's own declared HEALTHCHECK
        # actually reports healthy, and a separate `docker exec` probe proves what
        # /health actually returns.
        run: scripts/boot_smoke.sh azgenai-lab:ci

      # Everything below here touches Azure, so it is gated on both "this is
      # main" and "the session's ephemeral Azure resources currently exist"
      # (DEPLOY_ENABLED). Build and boot smoke above always run, including
      # on pull requests -- that is the point of a gate. ACR and the build
      # identity are ephemeral: after teardown, every push to main would
      # otherwise fail here for a reason that has nothing to do with the
      # code.
      - name: Azure login (build identity)
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_BUILD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          # Deliberately NOT passing -g/--resource-group here, even though
          # it looks like the tidier, more explicit choice. Without it, a
          # failed control-plane lookup raises ResourceNotFound, which the
          # CLI tolerates and falls back to <name>.azurecr.io plus a
          # data-plane token exchange that the AcrPush role does cover. With
          # -g, the CLI instead calls registries/read directly -- an action
          # AcrPush does not grant -- and that failure is not on the
          # tolerated path. Adding -g "for tidiness" would break the push.
          az acr login --name "$AZURE_ACR_NAME"

      - name: Tag and push
        id: push
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # This tag is a push artefact only -- it exists because `docker
          # push` needs a reference to push by -- never a deploy target.
          # The digest read back below is what crosses the job boundary and
          # what `deploy` actually addresses; see the comment on that line.
          IMAGE="${AZURE_ACR_NAME}.azurecr.io/azgenai-lab:sha-${IMAGE_SHA}"
          docker tag azgenai-lab:ci "$IMAGE"
          docker push "$IMAGE"
          # The point of this pipeline is that the bytes that passed the
          # gates above are the bytes that get deployed. A tag can be
          # repointed by a rerun; a digest cannot. The deploy job composes
          # the full reference from this digest plus the ACR name it already
          # has, so only the digest itself needs to cross the job boundary.
          # RepoDigests[0] (index 0, not filtered by repository): correct
          # here because a freshly built, freshly pushed image on a fresh
          # runner has exactly one repo digest -- pushed to exactly the one
          # registry above. Would need filtering on $IMAGE's repository to
          # stay correct if this image were ever pushed to more than one.
          FULL_DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          DIGEST="${FULL_DIGEST#*@}"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "$FULL_DIGEST" ]; then
            echo "Could not parse a digest out of docker inspect's RepoDigests[0]: '$FULL_DIGEST'" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [python, site, image]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # At most one deploy in flight, at most one more queued behind it (the
    # default `queue: single` -- a newer pending run displaces an older one,
    # never the other way around). cancel-in-progress stays false: a run
    # cancelled between `az containerapp update` and its own verification
    # steps would leave a revision nobody actually checked.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Freshness guard
        # Approval takes human time, and main does not wait for it. A run
        # approved after main has moved on must not deploy the stale commit
        # it started with -- and must not report success while doing
        # nothing, either: a green no-op and a green deploy would look
        # identical afterwards otherwise. See scripts/check_freshness.sh.
        env:
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
        run: scripts/check_freshness.sh "$CURRENT_SHA" main

      - name: Azure login (deploy identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          AZ_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZ_ACA_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "needs.image.outputs.digest is empty; refusing to deploy with an empty --image." >&2
            exit 1
          fi
          infra/scripts/update-container-app.sh --image "${AZURE_ACR_NAME}.azurecr.io/azgenai-lab@${DIGEST}"
