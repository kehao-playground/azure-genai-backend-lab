[project]
name = "azure-genai-backend-lab"
version = "0.1.0"
description = "A Python/FastAPI lab for building production-minded Azure GenAI backend applications."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Kehao Chen" }
]
dependencies = [
  "fastapi>=0.121.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "azure-identity>=1.17.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "openai>=2.45.0",
  "agent-framework-core==1.13.0",
  "agent-framework-openai==1.12.0",
  "pyjwt[crypto]>=2.13.0",
  "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "behave>=1.2.6",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.0",
  "httpx2>=2.5.0",
  # CommonMark parser for scripts/check_doc_anchors.py. Two hand-rolled
  # markdown parsers in that gate shipped a combined thirteen defects --
  # phantom headings inside fenced code and HTML comments, fence-legality
  # errors, entity and escape handling. Structure parsing is a solved problem
  # and this repo should not be re-solving it.
  "markdown-it-py>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azgenai_lab"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
# Day 22: audit tests import shared fixtures as `tests.unit.audit_helpers` —
# neither tests/ nor tests/unit/ carries __init__.py, so the project root
# must be on sys.path for that dotted import to resolve (implicit namespace
# packages do the rest).
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["azgenai_lab"]
