openapi: 3.1.0
info:
  title: Azure GenAI Backend Lab
  description: Production-minded Azure GenAI backend patterns with Python and FastAPI.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/chat:
    post:
      tags:
      - chat
      summary: Chat
      operationId: chat_api_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: 'Input rejected: content filter or invalid input'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated credential lacks required API permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown conversation_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Conversation token budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Service misconfiguration or storage failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Upstream LLM service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Upstream capacity exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearerAuth: []
  /api/v1/chat/stream:
    post:
      tags:
      - streaming
      summary: Stream Chat
      operationId: stream_chat_api_v1_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamingChatRequest'
        required: true
      responses:
        '200':
          description: "Server-Sent Events stream. Event vocabulary: `message.delta`\
            \ (`{text}`), `message.done` (`{status, incomplete_reason?, usage?, correlation_id}`;\
            \ `usage` carries the turn's provider-reported input/output/total tokens),\
            \ `error` (the error envelope). Exactly one terminal event (`message.done`\
            \ or `error`) ends a normally closed stream; clients must treat EOF without\
            \ a terminal as a failure and must ignore unknown event names. OpenAPI\
            \ cannot express these ordering invariants \u2014 the BDD feature `streaming_response.feature`\
            \ is the executable contract."
          headers:
            X-Conversation-Id:
              description: "The conversation this stream belongs to; send it as conversation_id\
                \ on the next turn. On a first turn the id is provisional: the turn\
                \ commits only with a keepable terminal (`message.done` completed\
                \ or max_output_tokens) \u2014 after `error`, content_filter/other,\
                \ or a disconnect, discard it and start a new conversation."
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: message.delta

                data: {"text": "pon"}


                event: message.delta

                data: {"text": "g"}


                event: message.done

                data: {"status": "completed", "correlation_id": "..."}


                '
        '400':
          description: 'Input rejected before the stream starts: content filter or
            invalid input'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated credential lacks required API permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown conversation_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Conversation token budget exhausted (checked before the stream
            starts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Service misconfiguration or storage failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Upstream LLM service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Upstream capacity exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearerAuth: []
  /api/v1/rag:
    post:
      tags:
      - rag
      summary: Rag
      operationId: rag_api_v1_rag_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AnsweredRagResponse'
                - $ref: '#/components/schemas/NoAnswerRagResponse'
                title: Response Rag Api V1 Rag Post
                discriminator:
                  propertyName: status
                  mapping:
                    answered: '#/components/schemas/AnsweredRagResponse'
                    no_answer: '#/components/schemas/NoAnswerRagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated credential lacks required API permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: "content_filtered (the question was blocked by the content\
            \ filter); invalid_input is deliberately absent \u2014 a provider context-length\
            \ rejection on this route is server-owned and surfaces as 500 rag_context_overflow,\
            \ because the prompt is composed from server-selected sources, not caller\
            \ input"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: "configuration_error (our deployment is misconfigured), embedding_rejected\
            \ (the embeddings service rejected the input), search_request_rejected\
            \ (the search service rejected the request), or rag_context_overflow (the\
            \ retrieved context could not fit the model input budget \u2014 either\
            \ the highest-ranked hit alone exceeds the local byte guardrail, or the\
            \ provider rejected the composed prompt for context length despite it)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: upstream_error (the upstream LLM service failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: upstream_throttled (upstream LLM capacity is exhausted) or
            search_unavailable (the search service is unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: upstream_timeout (the upstream LLM call timed out)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearerAuth: []
  /api/v1/agent:
    post:
      tags:
      - agent
      summary: Agent Turn
      operationId: agent_turn_api_v1_agent_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Task exceeds the byte boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated credential lacks required API permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Conversation token budget exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Conversation storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Agent run failed upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearerAuth: []
components:
  schemas:
    AgentRequest:
      properties:
        task:
          type: string
          title: Task
          description: The agent's task. Whitespace-only is rejected as 422; the 4,000-UTF-8-byte
            boundary is enforced by the service as 400.
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
          description: Continues an existing conversation (the agent sees prior user/assistant
            turns, and its own turn is appended). Omit to start a new one. Unknown
            ids are rejected with 404.
      type: object
      required:
      - task
      title: AgentRequest
    AgentResponse:
      properties:
        answer:
          type: string
          title: Answer
          description: 'May be empty when incomplete_reason is set: the run hit a
            limit before the model authored a final text.'
        conversation_id:
          type: string
          title: Conversation Id
        correlation_id:
          type: string
          title: Correlation Id
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
        status:
          type: string
          enum:
          - completed
          - incomplete
          title: Status
        incomplete_reason:
          anyOf:
          - type: string
            enum:
            - tool_call_limit
            - iteration_limit
          - type: 'null'
          title: Incomplete Reason
          description: "Additive extension of the Day 6 vocabulary: tool_call_limit\
            \ \u2014 the tool budget forced the final answer; iteration_limit \u2014\
            \ the model-call budget did. For both the answer is keepable."
        model_call_count:
          type: integer
          title: Model Call Count
        tool_calls:
          items:
            $ref: '#/components/schemas/AgentToolCallModel'
          type: array
          title: Tool Calls
          description: "Execution trace: tool names, parsed arguments and rounds.\
            \ Tool outputs are deliberately absent \u2014 they reached the model,\
            \ not the wire."
      type: object
      required:
      - answer
      - conversation_id
      - correlation_id
      - status
      - model_call_count
      - tool_calls
      title: AgentResponse
    AgentToolCallModel:
      properties:
        tool_name:
          type: string
          title: Tool Name
        arguments:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Arguments
          description: Parsed tool arguments; null when the model emitted unparseable
            JSON.
        round_index:
          type: integer
          title: Round Index
        executed:
          type: boolean
          title: Executed
      type: object
      required:
      - tool_name
      - arguments
      - round_index
      - executed
      title: AgentToolCallModel
    AnsweredRagResponse:
      properties:
        status:
          type: string
          const: answered
          title: Status
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/RagSource'
          type: array
          minItems: 1
          title: Sources
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
          description: Provider may omit usage even when answered.
        incomplete_reason:
          anyOf:
          - type: string
            enum:
            - max_output_tokens
            - content_filter
            - other
          - type: 'null'
          title: Incomplete Reason
        correlation_id:
          type: string
          title: Correlation Id
      type: object
      required:
      - status
      - answer
      - sources
      - usage
      - incomplete_reason
      - correlation_id
      title: AnsweredRagResponse
    ChatRequest:
      properties:
        message:
          type: string
          minLength: 1
          title: Message
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
          description: Continues an existing conversation. Omit to start a new one;
            the response returns the id to send on the next turn. Unknown ids are
            rejected with 404 conversation_not_found.
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        message:
          type: string
          title: Message
        conversation_id:
          type: string
          title: Conversation Id
        correlation_id:
          type: string
          title: Correlation Id
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsage'
          - type: 'null'
          description: "Provider-reported tokens for this turn \u2014 a request-level\
            \ usage signal for attribution and guardrails, not a billing record; null\
            \ only if the provider omitted its usage block."
        status:
          type: string
          enum:
          - completed
          - incomplete
          title: Status
          description: "Mirror of the stream terminal: `incomplete` means the reply\
            \ was truncated \u2014 see incomplete_reason for what the client may keep."
          default: completed
        incomplete_reason:
          anyOf:
          - type: string
            enum:
            - max_output_tokens
            - content_filter
            - other
          - type: 'null'
          title: Incomplete Reason
          description: "Set only when status is `incomplete`. Same client rules as\
            \ the Day 6 SSE vocabulary: keep the partial text for `max_output_tokens`;\
            \ discard or mask it for `content_filter`; treat it as unusable for `other`.\
            \ For `content_filter`/`other` the turn is not committed \u2014 on a first\
            \ turn the returned conversation_id never comes into existence."
      type: object
      required:
      - message
      - conversation_id
      - correlation_id
      title: ChatResponse
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        correlation_id:
          type: string
          title: Correlation Id
      type: object
      required:
      - error
      - correlation_id
      title: ErrorEnvelope
      description: 'The one error shape every non-2xx response uses (Day 3 contract).


        ``correlation_id`` is non-optional: the correlation middleware runs outside

        every exception handler, so an envelope without it is a bug, not a case.'
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        service:
          type: string
          title: Service
      type: object
      required:
      - status
      - service
      title: HealthResponse
    NoAnswerRagResponse:
      properties:
        status:
          type: string
          const: no_answer
          title: Status
        answer:
          type: 'null'
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/RagSource'
          type: array
          maxItems: 0
          title: Sources
        usage:
          type: 'null'
          title: Usage
        incomplete_reason:
          type: 'null'
          title: Incomplete Reason
        correlation_id:
          type: string
          title: Correlation Id
      type: object
      required:
      - status
      - correlation_id
      title: NoAnswerRagResponse
    RagRequest:
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
      type: object
      required:
      - question
      title: RagRequest
    RagSource:
      properties:
        number:
          type: integer
          title: Number
        chunk_id:
          type: string
          title: Chunk Id
        title:
          type: string
          title: Title
        heading_path:
          type: string
          title: Heading Path
        score:
          type: number
          title: Score
          description: 'Retrieval ranking signal. In the hybrid path this is an RRF
            fusion score: it orders results and is NOT a similarity, confidence, or
            grounding probability; do not apply thresholds to it.'
        reranker_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Reranker Score
          description: Semantic reranker score (0.0-4.0) when the semantic ranker
            is enabled, null otherwise.
      type: object
      required:
      - number
      - chunk_id
      - title
      - heading_path
      - score
      title: RagSource
    StreamingChatRequest:
      properties:
        message:
          type: string
          minLength: 1
          title: Message
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
          description: "Continues an existing conversation. Omit to start a new one;\
            \ the id comes back in the X-Conversation-Id response header (provisional\
            \ until a keepable message.done \u2014 see the 200 header description).\
            \ Unknown ids are rejected with 404 conversation_not_found."
      type: object
      required:
      - message
      title: StreamingChatRequest
    TokenUsage:
      properties:
        input_tokens:
          type: integer
          minimum: 0.0
          title: Input Tokens
        output_tokens:
          type: integer
          minimum: 0.0
          title: Output Tokens
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
        reasoning_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Reasoning Tokens
      type: object
      required:
      - input_tokens
      - output_tokens
      - total_tokens
      title: TokenUsage
      description: "Provider-reported token counts from the Responses API ``usage``\
        \ block (Day 9).\n\nThis is metering, not estimation \u2014 but it is a request-level\
        \ usage signal\nfor attribution and guardrails, not a billing record: the\
        \ invoice and Cost\nManagement meter records remain the source of truth, and\
        \ no per-request\n1:1 reconciliation against them is implied. ``input_tokens``\
        \ covers the\nfull replay context, which grows every turn."
  securitySchemes:
    bearerAuth:
      type: http
      description: Microsoft Entra ID Bearer token when AUTH_MODE=entra. Development
        AUTH_MODE=headers uses X-Tenant-Id, X-User-Id, and optional X-Group-Ids.
      scheme: bearer
